<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do u miss me? 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- floating hearts background -->
  <div class="hearts-bg" id="heartsBg"></div>

  <!-- ===================== SCREEN 1: QUESTION ===================== -->
  <main class="screen" id="questionScreen">
    <div class="card">
      <p class="eyebrow">psst, hey you 👀</p>
      <h1 class="question">Do u miss me?</h1>

      <div class="gif-wrap">
        <img src="https://media.tenor.com/EBV7OT7ACfwAAAAj/u-u-qua-qua-u-quaa.gif" alt="cute character" class="gif">
      </div>

      <p class="hint" id="hint">&nbsp;</p>

      <div class="btn-row" id="btnRow">
        <button class="btn btn-yes" id="yesBtn" type="button">Yes</button>
        <button class="btn btn-no" id="noBtn" type="button">No</button>
      </div>
    </div>
  </main>

  <!-- ===================== SCREEN 2: FINAL / QR ===================== -->
  <main class="screen hidden" id="finalScreen">
    <div class="card final-card">
      <div class="confetti" id="confetti"></div>
      <h1 class="final-title">Happy birthday sayangku 🎂💗</h1>
      <p class="final-sub">i'm so glad you exist. every year with you is my favorite one yet.</p>

      <div class="qr-section">
        <div class="qr-frame">
          <img src="qr.png" alt="QR code" class="qr-img">
        </div>
        <p class="qr-caption">scan here dear birthday girl<br>i love u ❤️</p>
      </div>
    </div>
  </main>

<script src="script.js"></script>
</body>
</html>
